<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun — Mochi et Aelysia 🌸</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#302441,#14121e 75%);color:#ffeafa;text-align:center}
main{width:min(94vw,580px);padding:30px 20px}
h1{font-size:clamp(1.5rem,5vw,2.4rem);margin:0 0 6px}p{color:#e7cde8}
.scene{height:340px;display:grid;place-items:center;position:relative;overflow:hidden}
.sparkle{position:absolute;font-size:2rem;opacity:.8;animation:drift 5s ease-in-out infinite alternate;user-select:none}
.s1{top:19%;left:17%}.s2{top:28%;right:15%;animation-delay:-2s}.s3{bottom:17%;right:25%;animation-delay:-3s}
.mochi{position:relative;width:170px;height:205px;transform-origin:50% 90%;animation:bop 1.4s ease-in-out infinite}
.head{position:absolute;width:145px;height:134px;top:10px;left:13px;border-radius:49% 49% 46% 46%;background:#ffe4f4;border:5px solid #754c82;box-shadow:inset -10px -9px #f4bddf}
.ear{position:absolute;width:48px;height:84px;top:-45px;background:#ffe4f4;border:5px solid #754c82;border-radius:70% 70% 27% 27%;z-index:-1}
.ear:after{content:"";position:absolute;inset:12px 10px 12px;background:#eea4d3;border-radius:80%}
.ear.left{left:17px;transform:rotate(-14deg)}.ear.right{right:17px;transform:rotate(14deg)}
.eye{position:absolute;top:57px;width:12px;height:16px;background:#46314e;border-radius:50%}
.eye.left{left:39px}.eye.right{right:39px}
.blush{position:absolute;top:78px;width:24px;height:12px;background:#f39fc9;border-radius:50%;opacity:.85}
.blush.left{left:19px}.blush.right{right:19px}
.mouth{position:absolute;top:76px;left:65px;font-size:20px;color:#67426f;line-height:1}
.body{position:absolute;left:45px;top:133px;width:84px;height:72px;border:5px solid #754c82;border-radius:45% 45% 42% 42%;background:#d8b8ec;z-index:-1}
.arm{position:absolute;width:54px;height:19px;background:#ffe4f4;border:4px solid #754c82;top:150px;border-radius:18px;transform-origin:90% 50%}
.arm.left{left:1px;animation:waveLeft .7s ease-in-out infinite alternate}
.arm.right{right:1px;transform-origin:10% 50%;animation:waveRight .7s ease-in-out infinite alternate}
.foot{position:absolute;width:46px;height:23px;top:189px;background:#754c82;border-radius:50%}
.foot.left{left:29px;animation:step .7s ease-in-out infinite alternate}
.foot.right{right:29px;animation:step .7s ease-in-out infinite alternate-reverse}
button{border:1px solid #a779bd;background:#473251;color:#fff2fa;border-radius:999px;padding:12px 20px;cursor:pointer;font:inherit}
button:hover{background:#60406f}button:focus-visible{outline:3px solid #f9c4ed;outline-offset:3px}
.paused *, .paused *::before,.paused *::after{animation-play-state:paused!important}
small{display:block;margin-top:18px;color:#bda8c5}
@keyframes bop{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-15px) rotate(7deg)}}
@keyframes waveLeft{from{transform:rotate(-25deg)}to{transform:rotate(30deg)}}
@keyframes waveRight{from{transform:rotate(25deg)}to{transform:rotate(-30deg)}}
@keyframes step{from{transform:translateY(0)}to{transform:translateY(-9px)}}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}

.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0 6px}
.choices button[aria-pressed="true"]{background:#8a518a;box-shadow:0 0 0 2px #edb2e5 inset}
.character[hidden]{display:none!important}
.aelysia{width:220px;height:280px;position:relative;animation:aelysiaSway 2.5s ease-in-out infinite;transform-origin:50% 85%;filter:drop-shadow(0 8px 8px #100b1780)}
.aelysia svg{width:100%;height:100%;overflow:visible}
@keyframes aelysiaSway{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.aelysia{animation:none!important}}
</style>
</head>
<body>
<main>
<h1>🌸 Le petit bal de Fun 🌸</h1>
<p id="description">Mochi est prêt à danser !</p>
<div class="choices" role="group" aria-label="Choisir un personnage">
<button type="button" id="choose-mochi" aria-pressed="true">🐰 Mochi</button>
<button type="button" id="choose-aelysia" aria-pressed="false">🌙 Aelysia</button>
</div>
<div class="scene" id="scene" aria-label="Un petit lapin rose danse doucement">
<span class="sparkle s1" aria-hidden="true">🌸</span><span class="sparkle s2" aria-hidden="true">✨</span><span class="sparkle s3" aria-hidden="true">💜</span>
<div class="mochi character" id="mochi" aria-hidden="true"><div class="head"><div class="ear left"></div><div class="ear right"></div><div class="eye left"></div><div class="eye right"></div><div class="blush left"></div><div class="blush right"></div><div class="mouth">ᴗ</div></div><div class="arm left"></div><div class="arm right"></div><div class="body"></div><div class="foot left"></div><div class="foot right"></div></div>
<div class="aelysia character" id="aelysia" hidden aria-hidden="true">
<svg viewBox="0 0 240 310" role="img" aria-label="Aelysia, héroïne chibi aux cheveux blonds et rouges, portant une épée et un orbe magique">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe1a1"/><stop offset="1" stop-color="#dc9b52"/></linearGradient>
<linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff795b"/><stop offset="1" stop-color="#922b37"/></linearGradient>
<radialGradient id="orb"><stop stop-color="#ff8bdc"/><stop offset=".4" stop-color="#9d3bdd"/><stop offset=".75" stop-color="#352071"/><stop offset="1" stop-color="#15152e"/></radialGradient>
</defs>
<!-- cape and flowing two-tone hair -->
<path d="M86 168 Q33 184 12 259 L64 248 L81 281 L117 255 L171 277 L191 235 L225 256 Q207 188 156 169Z" fill="#331b32" stroke="#160e20" stroke-width="5"/>
<path d="M116 43 Q22 35 29 160 Q24 214 55 224 L91 200 Q114 120 116 43Z" fill="url(#ruby)" stroke="#71303f" stroke-width="4"/>
<path d="M108 38 Q214 12 216 140 Q236 203 192 231 L165 193 L143 117Z" fill="url(#gold)" stroke="#a36c3f" stroke-width="4"/>
<!-- boots, body -->
<path d="M83 215 L79 270 L112 274 L116 209 M129 210 L130 272 L166 273 L160 217" fill="#25202e" stroke="#14101a" stroke-width="7"/>
<path d="M76 267 L115 266 L116 287 Q81 297 72 285Z M126 266 L167 266 L174 286 Q140 298 126 287Z" fill="#292530" stroke="#14101a" stroke-width="5"/>
<path d="M75 173 Q119 155 164 173 L170 230 L143 240 L121 222 L98 241 L69 225Z" fill="#241f2b" stroke="#5e4155" stroke-width="5"/>
<path d="M100 177 L122 209 L145 177 M121 204 L121 229" fill="none" stroke="#d59bb1" stroke-width="4"/>
<path d="M118 179 l6 8 -6 8 -6 -8Z" fill="#f7d6e5"/>
<!-- head and red-blonde fringe -->
<ellipse cx="121" cy="110" rx="79" ry="73" fill="#ffd3ad" stroke="#9d6c68" stroke-width="4"/>
<path d="M45 91 Q37 25 115 27 L121 70 Q102 82 90 107 L83 59 Q69 95 45 91Z" fill="url(#ruby)"/>
<path d="M112 25 Q195 15 202 96 L174 77 L157 111 L148 67 L123 91 L118 60Z" fill="url(#gold)" stroke="#a97040" stroke-width="3"/>
<!-- heterochromia -->
<ellipse cx="88" cy="121" rx="15" ry="19" fill="#fb5365" stroke="#4f283b" stroke-width="3"/>
<ellipse cx="153" cy="121" rx="15" ry="19" fill="#d454b6" stroke="#4f283b" stroke-width="3"/>
<circle cx="92" cy="114" r="5" fill="#fff5f8"/><circle cx="157" cy="114" r="5" fill="#fff5f8"/>
<ellipse cx="68" cy="147" rx="12" ry="6" fill="#ff9b9e" opacity=".7"/>
<ellipse cx="173" cy="147" rx="12" ry="6" fill="#ff9b9e" opacity=".7"/>
<path d="M109 150 Q121 161 134 150" fill="none" stroke="#9b5b62" stroke-width="3" stroke-linecap="round"/>
<path d="M188 148 L194 155 L188 163" stroke="#a47daa" stroke-width="2" fill="none"/>
<!-- arms, orb -->
<path d="M79 184 Q56 202 46 218" fill="none" stroke="#24202d" stroke-width="21" stroke-linecap="round"/>
<path d="M160 183 Q187 177 202 159" fill="none" stroke="#24202d" stroke-width="21" stroke-linecap="round"/>
<circle cx="202" cy="146" r="13" fill="#ffd3ad" stroke="#9d6c68" stroke-width="3"/>
<circle cx="202" cy="114" r="28" fill="url(#orb)" stroke="#713d91" stroke-width="4"/>
<path d="M186 114 Q198 94 220 107 Q205 126 195 119" fill="none" stroke="#ed90de" stroke-width="3" stroke-linecap="round"/>
<circle cx="214" cy="105" r="4" fill="#fff0ff"/>
<!-- sword in left hand -->
<path d="M42 218 L-8 302 L10 309 L60 237Z" fill="#35313e" stroke="#17141d" stroke-width="4"/>
<path d="M16 267 L52 239" stroke="#aa859c" stroke-width="4"/>
<path d="M18 218 L65 243 M36 251 L52 204" stroke="#27212e" stroke-width="13" stroke-linecap="round"/>
<path d="M36 220 L47 231 L36 243 L25 231Z" fill="#e55c63"/>
</svg></div>
</div>
<button id="toggle" type="button" aria-pressed="false">⏸ Mettre en pause</button>
<small>Animation douce, sans flash et sans son. Le bouton permet de tout arrêter.</small>
</main>
<script>
const scene=document.getElementById('scene');
const toggle=document.getElementById('toggle');
const mochi=document.getElementById('mochi');
const aelysia=document.getElementById('aelysia');
const mochiButton=document.getElementById('choose-mochi');
const aelysiaButton=document.getElementById('choose-aelysia');
const description=document.getElementById('description');
function choose(character){
 const isMochi=character==='mochi';
 mochi.hidden=!isMochi;
 aelysia.hidden=isMochi;
 mochiButton.setAttribute('aria-pressed',String(isMochi));
 aelysiaButton.setAttribute('aria-pressed',String(!isMochi));
 description.textContent=isMochi?'Mochi est prêt à danser !':'Aelysia rejoint la danse avec sa magie astrale !';
}
mochiButton.addEventListener('click',()=>choose('mochi'));
aelysiaButton.addEventListener('click',()=>choose('aelysia'));
toggle.addEventListener('click',()=>{
 const paused=scene.classList.toggle('paused');
 toggle.textContent=paused?'▶ Reprendre la danse':'⏸ Mettre en pause';
 toggle.setAttribute('aria-pressed',String(paused));
});
</script>
</body>
</html>
